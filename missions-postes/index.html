<!DOCTYPE html>
<!-- Mode champion · M12 — Missions de poste, épisode 1 « Dans le jeu » (v92)
     Page autonome reprise de la maquette jouable validée par Nicolas (20/11/2026) : 8 postes, 4 situations chacun,
     variante de la situation 4, bulles de parole, vignettes « Sur le terrain ». Toutes les données sont dans l'objet POSTS ;
     le crochet de test est window.MQ.
     - Dans l'appli (?educ=1, dans une iframe de l'espace éduc, essai : les enfants ne la voient pas encore) : choix du poste,
       menu « ? » et « Mon avis » sur chaque situation et sur la fin ; l'avis part par l'appli, avec la session de l'éduc
       (postMessage, même site seulement). Retour sur le choix du poste, ou « Missions » à la fin : l'appli reprend la main.
     - ?p=pil&s=2&alt=1 : ouvrir directement une situation (s = 1 à 4 ; 0 = la fin de l'épisode ; alt=1 : la variante).
     - Aucun prénom d'enfant ici (dépôt public) : celui de l'appli (?prenom= ou message « init »), sinon « Champion ».
     Contenu (vocabulaire du club, règles de placement, réponses des QCM) : ne rien changer sans Nicolas. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions de poste · épisode 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Barlow:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Un seul thème, celui de l'appli : sombre. Téléphone d'abord, une colonne ; iPad paysage : terrain à gauche, texte à droite. */
  color-scheme:dark;
  --bg:#070A12; --p1:#0A0F1F; --p2:#0C1120; --p3:#0E1428;
  --l1:#1E2740; --l2:#2A3557; --l3:#34405F;
  --ink:#E8ECF7; --ink2:#C7CEDF; --ink3:#AEB6CC; --dim:#8A93AD;
  --cyan:#38E8FF; --rose:#FF4FA3; --gold:#FFC23D; --green:#3DFFB0; --violet:#B48CFF; --orange:#FF8A3D; --red:#FF4F6D; --blue:#4D9BFF;
  --poste:#F2AA06; --pitch:#0B231E;
  --ft:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;
  --fh:'Chakra Petch','Trebuchet MS',Verdana,sans-serif;
  --fb:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  --bev:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
  --bevs:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.42 var(--fb);-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
p,h1,h2,ol{margin:0;padding:0}
ol{list-style:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* Barre du haut : Retour à gauche, aide à droite, fond uni */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--l1)}
.bv{position:relative;flex:none;width:48px;height:44px;border:0;padding:0;background:var(--b,var(--cyan));clip-path:var(--bevs);display:grid;place-items:center}
.bv::before{content:"";position:absolute;inset:1.5px;background:var(--p2);clip-path:var(--bevs)}
.bv>*{position:relative}
.bv svg{width:20px;height:20px;fill:none;stroke:var(--b,var(--cyan));stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bv.hp{--b:var(--l3);font:700 18px var(--fh);color:var(--ink)}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.k{font:600 12px/1.3 var(--fh);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tt b{font:600 15px/1.25 var(--fh);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.scr{flex:1;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px}
.h1,.h2,.q{text-wrap:balance}
.h1{font:italic 900 46px/.92 var(--ft);text-transform:uppercase;color:#fff;text-shadow:3px 3px 0 var(--rose);letter-spacing:.005em}
.h2{font:italic 800 26px/1 var(--ft);text-transform:uppercase;color:#fff;margin-top:6px}
.rose{color:var(--rose)}

/* Boutons */
.pri{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;padding:8px 18px;border:0;background:var(--cyan);color:#04222A;font:700 17px/1.1 var(--fh);letter-spacing:.14em;text-transform:uppercase;text-align:center;clip-path:var(--bev)}
.pri[disabled]{background:var(--l1);color:var(--dim);cursor:default}
.pri svg{width:16px;height:16px;fill:currentColor}
.sec{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 14px;border:1.5px solid var(--cyan);background:transparent;color:var(--cyan);font:700 15px/1.1 var(--fh);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.sec svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cta{position:sticky;bottom:0;z-index:5;padding:12px 16px 16px;background:var(--bg);border-top:1px solid var(--l1)}
.row{display:flex;gap:10px}
.row .sec{flex:0 0 40%}
.row .pri{flex:1}

/* Accroche */
.hero{display:flex;align-items:center;gap:14px}
.emb{flex:none;width:84px;height:84px;background:var(--poste);clip-path:var(--bev);position:relative;display:grid;place-items:center}
.emb::before{content:"";position:absolute;inset:2px;background:#0E1428;clip-path:var(--bev)}
.emb svg{position:relative;width:60px;height:60px}
.pp{display:inline-block;margin-top:10px;padding:3px 10px;background:var(--poste);color:#2A1D00;font:700 13px/1.4 var(--fh);letter-spacing:.14em;text-transform:uppercase}
.job{font-size:18px;line-height:1.38;color:var(--ink)}
.stats{display:grid;grid-template-columns:.8fr 1.1fr 1.25fr;gap:8px}
.stat .k{letter-spacing:.09em;white-space:nowrap}
.stat{border:1px solid var(--l2);background:var(--p3);padding:10px 12px 9px}
.stat b{display:block;font:700 26px/1.1 var(--fh);color:var(--ink)}
.stat.g{border-color:#7A5F1C}.stat.g b{color:var(--gold)}
.mi{border:1px solid var(--l2);border-left:4px solid var(--c);background:var(--p3);padding:12px 14px 13px}
.mi .k{color:var(--c)}
.mi b{display:block;font:600 20px/1.25 var(--fb);margin:3px 0 3px}
.mi p:last-child{color:var(--ink2)}
.mi.def{--c:var(--blue)}.mi.att{--c:var(--green)}
.par{position:relative;display:flex;flex-direction:column;gap:14px;padding:4px 0 2px}
.par::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--l2)}
.par li{position:relative;display:flex;align-items:center;gap:14px;min-height:36px}
.dm{flex:none;width:28px;height:28px;display:grid;place-items:center;background:var(--l2);color:var(--ink3);font:700 13px var(--fh);transform:rotate(45deg)}
.dm i{font-style:normal;transform:rotate(-45deg)}
.par li.on .dm{background:var(--rose);color:#2B0618}
.par li div{display:flex;flex-direction:column}
.par li b{font:600 17px/1.25 var(--fb)}
.par li span{font-size:14px;color:var(--dim)}
.par li.on span{color:var(--rose)}

/* Écran de jeu */
.play{flex:1;padding:12px 16px 18px;display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:max-content;gap:10px;align-content:start}
.prog{display:flex;gap:6px}
.prog i{flex:1;height:5px;background:var(--l2)}
.prog i.cur{background:var(--rose)}
.prog i.ok{background:var(--gold)}
.prog i.done{background:var(--dim)}
.tag{margin-top:8px;color:var(--c)}
.tag.def{--c:var(--blue)}.tag.att{--c:var(--green)}
.ctx{font-size:17px;line-height:1.35;color:var(--ink)}
.q{font:700 21px/1.2 var(--fb);color:#fff;margin-top:3px}
.pl-q{min-height:78px}
.brief{display:flex;align-items:center;width:100%;min-height:min(54vh,430px);padding:10px 0 30px;border:0;background:none}
.brief .bt{display:flex;flex-direction:column;gap:18px}
.brief .ctx{font:500 25px/1.3 var(--fb);color:var(--ink)}
.brief .q{font:700 38px/1.08 var(--fb);color:#fff;margin:0}
.play.enter .hint,.play.enter .stage,.play.enter .chs{animation:rise .5s .22s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hint{min-height:44px;display:flex;align-items:center;gap:10px;font:600 18px/1.25 var(--fb);color:var(--ink)}
.hint .tp{flex:none;width:26px;height:26px;fill:none;stroke:var(--cyan);stroke-width:1.8;color:var(--cyan)}
.lg{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink3)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--poste)}
.lg em{font:700 15px var(--fh);font-style:normal;color:var(--red);margin-left:6px}
.tabs{display:flex;gap:8px}
.tab{flex:1;min-height:44px;padding:4px 8px;border:1px solid var(--l2);background:var(--p3);color:var(--ink3);font:600 13px/1.15 var(--fh);letter-spacing:.1em;text-transform:uppercase;text-align:center}
.tab[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan);background:#0B1D2B}
.tab[disabled]{opacity:.45;cursor:default}
.pass{position:absolute;left:6px;top:6px;display:flex;align-items:center;gap:6px;padding:3px 7px 3px 3px;background:rgba(7,10,18,.86);border:1px solid var(--l2);font:600 12px/1.3 var(--fh);letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
.pass b{display:inline-grid;place-items:center;width:20px;height:20px;background:var(--cyan);color:#06121F;font:700 12px var(--fh);letter-spacing:0}
.pass:not(:has(b)){padding-left:9px}
.tab b{display:inline-grid;place-items:center;width:20px;height:20px;margin-right:8px;background:var(--l3);color:var(--ink);font:700 12px var(--fh);letter-spacing:0;vertical-align:1px}
.tab[aria-pressed="true"] b{background:var(--cyan);color:#06121F}
.pri.wt{position:relative;overflow:hidden}
.pri.wt i{position:absolute;left:0;bottom:0;height:5px;width:100%;background:var(--cyan);transform-origin:0 50%;animation:fill linear both}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stage{position:relative;width:100%;aspect-ratio:100/90;background:var(--pitch);border:1px solid var(--l2);overflow:hidden}
.stage.zm{aspect-ratio:100/70}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.lb{font-family:var(--fh);font-weight:700}
.tv.ask{cursor:pointer}
.en .in{transform-box:fill-box;transform-origin:center;transition:transform .2s,opacity .2s}
.en.gr .in{transform:scale(1,.58);opacity:.62}
.toi,.toi *{touch-action:none}
.toi{cursor:grab}
.halo{transform-box:fill-box;transform-origin:center;opacity:0}
.tv.ask .halo{animation:halo 1.5s ease-out infinite}
@keyframes halo{0%{transform:scale(.75);opacity:.95}100%{transform:scale(1.5);opacity:0}}
.zone{transition:opacity .35s}
.vcap{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(7,10,18,.9);border:1px solid var(--l2);font:500 15px/1.25 var(--fb);color:var(--ink)}
.vcap b{flex:none;width:24px;height:24px;display:grid;place-items:center;background:var(--poste);color:#2A1D00;font:700 13px var(--fh)}
.vleg{position:absolute;left:8px;top:8px;display:flex;gap:10px;padding:4px 8px;background:rgba(7,10,18,.82);font:600 12px/1.3 var(--fh);letter-spacing:.06em;color:var(--ink2)}
.vleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}

.vd{min-height:82px;display:flex;flex-direction:column;gap:6px}
.vd .l1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{padding:4px 10px;font:700 13px/1.3 var(--fh);letter-spacing:.14em;text-transform:uppercase;background:var(--c);color:var(--t)}
.vd.ok{--c:var(--green);--t:#04261B}.vd.near{--c:var(--gold);--t:#2A1D00}.vd.no{--c:var(--red);--t:#2B0610}
.xp{font:700 14px var(--fh);letter-spacing:.08em;color:var(--gold)}
.vd p{font-size:16px;line-height:1.38;color:var(--ink)}
.vd .fbk{color:var(--c);font-weight:700}
.sph{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:14px;color:var(--ink3)}
.sph i{flex:none;width:18px;height:13px;background:#F4F6FC;border-radius:5px;position:relative}
.sph i::after{content:"";position:absolute;left:4px;bottom:-4px;border:4px solid transparent;border-top-color:#F4F6FC;border-bottom:0}
.q3{border:1px solid var(--l2);border-left:4px solid var(--c);background:var(--p3);padding:10px 12px 12px}
.q3.def{--c:var(--blue)}.q3.att{--c:var(--green)}
.q3 .k{color:var(--c);margin-bottom:7px}
.q3 ol{display:flex;flex-direction:column;gap:8px}
.q3 li{display:flex;gap:10px;align-items:flex-start}
.q3 li i{flex:none;width:24px;height:24px;display:grid;place-items:center;font:700 12px var(--fh);font-style:normal;background:var(--c);color:#06121F}
.q3 li p{font-size:15px;line-height:1.35;color:var(--ink2)}
.q3 li b{color:var(--ink);font-weight:600}
.q3n{font-size:16px;font-weight:600;color:var(--poste)}
.stars .sc.rj{font-size:15px;color:var(--ink3)}
.les{border:1px solid var(--l2);border-left:4px solid var(--poste);background:var(--p3);padding:10px 14px 12px}
.les .k{color:var(--poste)}
.les p:last-child{margin-top:3px;font-size:16px;color:var(--ink)}
.chs{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;align-items:center;gap:12px;width:100%;min-height:79px;padding:6px 12px 6px 6px;border:1px solid var(--l2);background:var(--p3)}
.ch:active{border-color:var(--cyan)}
.ch .th{flex:none;width:90px;height:65px;background:var(--pitch);border:1px solid var(--l1);display:block}
.ch .th svg{width:100%;height:100%;display:block}
.ch .tx{display:flex;flex-direction:column;min-width:0}
.ch b{font:600 17px/1.25 var(--fb)}
.ch .tx span{font-size:14px;color:var(--ink3)}

/* Fin */
.stars{display:flex;gap:8px;align-items:center}
.stars svg{width:38px;height:38px}
.stars .sc{margin-left:8px;font:700 22px var(--fh);color:var(--gold)}
.rep{display:flex;flex-direction:column;gap:8px}
.rep li{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--l2);background:var(--p3);padding:10px 12px}
.rep li i{flex:none;width:26px;height:26px;display:grid;place-items:center;font:700 13px var(--fh);font-style:normal;background:var(--c);color:#06121F}
.rep li b{color:var(--c);font-weight:600}
.defi{border:1px solid #7A5F1C;background:#141004;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.defi .k{color:var(--gold)}
.defi b{font:600 19px/1.3 var(--fb)}
.defi p{color:var(--ink2)}
.tog{align-self:flex-start;min-height:44px;padding:6px 14px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font:700 14px var(--fh);letter-spacing:.12em;text-transform:uppercase}
.tog[aria-pressed="true"]{background:var(--gold);color:#2A1D00}
.pw{display:flex;align-items:center;gap:12px;border:1px solid var(--l2);background:var(--p3);padding:10px 12px}
.pw svg{flex:none;width:44px;height:44px}
.pw div{display:flex;flex-direction:column}
.pw b{font:600 17px/1.25 var(--fb)}
.pw span{font-size:14px;color:var(--ink3)}
.nx{display:flex;align-items:center;gap:12px;border:1px dashed var(--l3);padding:10px 12px;color:var(--ink3)}
.nx svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nx b{display:block;color:var(--ink);font-weight:600}

/* Choix du poste (maquette seulement) */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt{display:flex;align-items:center;gap:10px;min-height:66px;padding:8px 10px;border:1px solid var(--l2);border-left:4px solid var(--c);background:var(--p3)}
.pa{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#101A2C;border:2px solid var(--c);color:var(--c);font:700 13px var(--fh)}
.pn{display:flex;flex-direction:column;min-width:0}
.pn b{font:600 16px/1.2 var(--fb)}
.pn span{font-size:13px;line-height:1.25;color:var(--ink3)}
/* Menu de la maquette, message */
.ov{position:fixed;inset:0;z-index:20;background:rgba(3,5,10,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--p2);border-top:1px solid var(--l3);padding:16px 16px 20px;display:flex;flex-direction:column;gap:8px}
.sheet p{color:var(--ink3);font-size:14px;margin-bottom:4px}
.mn{min-height:48px;padding:6px 14px;border:1px solid var(--l2);background:var(--p3);font:600 16px var(--fb)}
.mn.on{border-color:var(--cyan);color:var(--cyan)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);background:var(--l1);border:1px solid var(--l3);padding:10px 14px;font-size:15px;text-align:center}

/* (v92) Essai éducs : une barre sous la barre du haut, « Mon avis » sur chaque situation et sur la fin */
.hdw{position:sticky;top:0;z-index:6}
.hdw>.top{position:relative}
.eb{display:flex;align-items:center;gap:10px;min-height:52px;padding:4px 16px;background:var(--p2);border-bottom:1px solid var(--l1)}
.eb .k{flex:none;color:var(--gold)}
.ebs{flex:1;min-width:0;font:600 14px/1.2 var(--fb);color:var(--dim);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.ebs.juste{color:var(--green)}.ebs.revoir{color:var(--orange)}
.ebb{flex:none;min-height:44px;padding:4px 14px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);font:700 13px/1.1 var(--fh);letter-spacing:.12em;text-transform:uppercase;text-align:center}
.ebb:active{background:#1C1606}
@media (max-width:359px){ .eb{gap:8px;padding:4px 12px} .eb .k{display:none} }

/* iPad en paysage : le terrain à gauche, le reste à droite */
@media (min-width:900px) and (orientation:landscape){
  .app{max-width:1060px}
  .play{grid-template-columns:minmax(0,1fr) 400px;column-gap:22px;padding-top:18px}
  .play>*{grid-column:2}
  .play.brf{grid-template-columns:minmax(0,620px);justify-content:center}
  .play.brf>*{grid-column:1}
  .play>.stage{grid-column:1;grid-row:1/span 6;align-self:start;margin:0 auto}
  .play>.stage:not(.zm){max-width:calc((100vh - 100px)*1.111)}
  .play>.stage.zm{max-width:calc((100vh - 100px)*1.428)}
  .scr.intro,.scr.end,.scr.pick{max-width:620px;margin:0 auto;width:100%}
  .cta{max-width:620px;margin:0 auto;width:100%}
  .cta.pl{max-width:none;display:flex;justify-content:flex-end;border-top:0;padding-top:0}
  .cta.pl>*{width:400px}
}
@media (max-width:359px){ .h1{font-size:40px} .brief .q{font-size:32px} .brief .ctx{font-size:22px} .hint{font-size:16px} .pri{letter-spacing:.1em} }
@media (prefers-reduced-motion:reduce){ .tv.ask .halo{animation:none;opacity:.8} .en .in,.zone{transition:none} .play.enter .hint,.play.enter .stage,.play.enter .chs,.pri.wt i{animation:none} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="ov" id="menu" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var RM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
var PC = {pil:'#FF6A3D',tal:'#FE8A00',l3:'#F2AA06',m9:'#CAE268',o10:'#A6E06A',ctr:'#7FD67A',ail:'#57C98A',arr:'#33BFA8'};
var COL = {me:'#FFC23D', us:'#38E8FF', them:'#FF4F6D'};

  if(d.mp==='init'){
    var pn=nomOk(d.prenom); if(pn&&pn!==PRENOM){ PRENOM=pn; if(S.scr==='intro'||S.scr==='end') render(); }
    MES={}; (Array.isArray(d.mes)?d.mes:[]).forEach(function(x){ if(x&&(x.avis==='juste'||x.avis==='revoir')) MES[cle(x)]=x.avis; });
    ebUp();
  }else if(d.mp==='avisOk'&&d.retour&&typeof d.retour==='object'){
    var r=d.retour; if(r.avis==='juste'||r.avis==='revoir') MES[cle(r)]=r.avis; ebUp();
  }
});
(function(){
  var p=ORDER.indexOf(QS.p)>=0?QS.p:'l3', s=QS.s, alt=QS.alt==='1';
  setPost(p); if(alt){ S.alt=true; build(); }
  if(ORDER.indexOf(QS.p)<0) render();
  else if(/^[1-4]$/.test(s)) go('play',+s-1);
  else if(s==='0'){ S.res=['ok','near','ok','ok']; go('end'); }
  else go('intro');
  if(EDUC) versAppli({mp:'pret'});
})();
window.MQ.ici=ici; window.MQ.MES=function(){ return MES; };
})();
</script>
