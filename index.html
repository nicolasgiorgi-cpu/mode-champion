<script>
/* « Réparer l'appli » : ?reset=1 vide la copie de l'appli et les données gardées (on reste connecté si la session est saine),
   ?reset=2 repart de zéro sur cet appareil (il faudra retaper les codes) */
(function () {
  var m = /[?&]reset=(\d)/.exec(location.search);
  if (!m) return;
  window.__mcResetting = true;
  var tasks = [];
  try { if (navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) { }
  try { if (window.caches) tasks.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) { }
  function get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  var kid = get('mc-kid'), adult = get('mc-adult');
  var kidOk = !!(kid && typeof kid.token === 'string' && kid.joueur && kid.joueur.id);
  var adultOk = !!(adult && typeof adult.token === 'string' && (adult.role === 'e' || adult.role === 'f'));
  var keep = m[1] === '2' ? [] : ['mc-recents', 'mc-prefs', 'mc-mute', 'mc-shared', 'mc-guide-vu'].concat(kidOk ? ['mc-kid', 'mc-kid-seen'] : []).concat(adultOk ? ['mc-adult', 'mc-adult-open'] : []);
  try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('mc-') === 0 && keep.indexOf(k) < 0) localStorage.removeItem(k); }); } catch (e) { }
  // adresse neuve : on est sûr de recevoir la dernière version du site, pas une copie
  function again() { location.replace(location.pathname + '?r=' + Date.now()); }
  Promise.all(tasks).catch(function () { }).then(again);
  setTimeout(again, 3000);
})();
</script>
<style>
/* écran d'ouverture, affiché avant tout le reste (pas d'écran noir) */
html,body{background:#070A12;color:#EAF0FF;margin:0}
.boot{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;text-align:center;font-family:system-ui,-apple-system,sans-serif}

.boot .dots{display:flex;gap:10px}

.boot .dots i:nth-child(2){animation-delay:.15s}.boot .dots i:nth-child(3){animation-delay:.3s}
@keyframes bootb{50%{opacity:.2}}
.boot p{margin:0;max-width:340px;color:#AEB9D6;font-size:15px;line-height:1.45}
.boot .bb{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px}

.boot button.g{background:transparent;color:#EAF0FF;border:1px solid #34405F}
.boot button small{display:block;margin-top:5px;font:500 12px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:0;text-transform:none;color:#AEB9D6}

<div id="app" aria-live="polite"><div class="boot" id="boot" role="status"><b>Mode<br><span>champion</span></b><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><p id="bootmsg">Chargement…</p><div class="bb" id="bootbtns" hidden><button type="button" onclick="location.reload()">Réessayer</button><button type="button" class="g" onclick="location.replace(location.pathname+'?reset=1')">Réparer l'appli</button><button type="button" class="g" onclick="location.replace(location.pathname+'?reset=2')">Repartir de zéro<small>il faudra retaper les codes</small></button></div></div></div>
<script>
/* si l'appli ne démarre pas (réseau qui bloque, fichier qui manque, erreur), on le dit au lieu d'un écran vide */
(function () {
  var BOOT = document.getElementById('app').innerHTML, fileFail = false;
  function show(txt, detail) {
    if (window.__mcStarted) return;
    var m = document.getElementById('bootmsg'), b = document.getElementById('bootbtns'), app = document.getElementById('app');
    if ((!m || !b) && app) { app.innerHTML = BOOT; m = document.getElementById('bootmsg'); b = document.getElementById('bootbtns'); }
    if (!m || !b) return;
    m.innerHTML = txt + (detail ? '<br><code>' + String(detail).replace(/[<>&]/g, '') + '</code>' : '');
    b.hidden = false;
  }
  window.__mcBootFail = show;
  window.addEventListener('error', function (e) {
    if (window.__mcStarted || window.__mcResetting) return;
    var t = e.target;
    if (t && t !== window && t.tagName) {
      var u = t.src || t.href || '';
      if ((t.tagName !== 'SCRIPT' && t.tagName !== 'LINK') || u.indexOf(location.origin) !== 0) return;   // les polices Google, une image… ne bloquent pas l'appli
      fileFail = true;
      show('Un fichier de l\'appli n\'a pas pu être chargé. Vérifie la connexion internet, puis réessaie.', u.split('/').pop());
    } else if (!fileFail) show('L\'appli n\'a pas pu démarrer.', (e.message || '') + ' ' + ((e.filename || '').split('/').pop() || '') + (e.lineno ? ':' + e.lineno : ''));
  }, true);
  setTimeout(function () { if (!fileFail) show('C\'est long… La connexion internet est peut-être lente ou bloquée (certains Wi-Fi d\'entreprise ou d\'école bloquent l\'appli). Essaie en 4G, ou réessaie.'); }, 9000);
})();
</script>
